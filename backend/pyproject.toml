[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AkinduID", email = "akinduid@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
